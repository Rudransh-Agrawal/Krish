<style>
:root{color-scheme:dark;--bg:#07060d;--card:#12101c;--ink:#e6e1f5;--mute:#8a82a8;--line:#2a2440;--acc:#9b6bff;--accink:#0b0714;--danger:#ff6b8a;--glow:rgba(155,107,255,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b1233 0%,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}

@keyframes fog{from{opacity:.5;transform:translateX(-2%)}to{opacity:1;transform:translateX(2%)}}

.card{background:linear-gradient(180deg,rgba(24,20,40,.92),rgba(14,12,24,.92));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 0 24px rgba(0,0,0,.5)}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px;letter-spacing:.04em}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0b0914;color:var(--ink);font:inherit}
input:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:var(--accink);font-weight:700;margin-top:14px;box-shadow:0 0 16px var(--glow)}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:transparent;color:var(--danger);border:1px solid var(--line);margin:0;padding:6px 10px;font-weight:500;font-size:.85rem;box-shadow:none}
.msg{font-size:.9rem;margin-top:10px;color:var(--mute)}
.note{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.nm{min-width:0}
.nm a{color:var(--acc);font-weight:700;text-decoration:none;word-break:break-word}
.nm a:hover{text-shadow:0 0 10px var(--glow)}
.meta{font-size:.8rem;color:var(--mute)}
.tag{display:inline-block;background:#0b0914;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:.78rem;margin-right:6px}
.empty{color:var(--mute);text-align:center;padding:20px 0;font-style:italic}

#lock[hidden]{display:none}
.box{width:100%;max-width:340px;text-align:center}
.eye{font-size:3rem;filter:drop-shadow(0 0 18px var(--glow));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.8}}
.box h2{margin:10px 0 4px;letter-spacing:.12em;font-weight:400}
.box p{color:var(--mute);font-style:italic;margin:0 0 14px}
.box input{text-align:center;letter-spacing:.3em;font-size:1.2rem}
.box button{width:100%}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---- murder mystery theme ---- */
:root{--bg:#070405;--card:#120a0c;--ink:#ecdfe0;--mute:#9c7f84;--line:#3a1a20;--acc:#e0314b;--accink:#fff;--danger:#ff5b6e;--glow:rgba(224,49,75,.45)}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a0a12 0%,var(--bg) 62%) fixed}
body::before{background:radial-gradient(600px 300px at 15% 90%,rgba(150,10,30,.22),transparent 70%),radial-gradient(500px 260px at 90% 20%,rgba(90,10,20,.2),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle 240px at var(--mx,50%) var(--my,25%),transparent 0,rgba(0,0,0,.55) 70%,rgba(0,0,0,.72) 100%)}

input,select{background:#0a0507}
.tag{background:#0a0507}

@keyframes flicker{0%,18%,22%,60%,64%,100%{opacity:1;text-shadow:0 0 22px var(--glow)}20%,62%{opacity:.35;text-shadow:none}21%{opacity:.8}}
.tape{position:relative;overflow:hidden;white-space:nowrap;margin:0 -20px 6px;transform:rotate(-1.2deg);background:repeating-linear-gradient(45deg,#f2c500 0 14px,#111 14px 28px);box-shadow:0 0 16px rgba(0,0,0,.7)}
.tape span{display:inline-block;padding:3px 0;background:#f2c500;color:#111;font:700 .72rem/1.4 system-ui,sans-serif;letter-spacing:.2em;animation:slide 22s linear infinite;margin:3px 0}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.drips{position:relative;height:0;pointer-events:none}
.drips i{position:absolute;top:0;width:5px;border-radius:0 0 5px 5px;background:linear-gradient(#a40f26,#e0314b);box-shadow:0 0 8px rgba(224,49,75,.5);animation:drip 6s ease-in infinite}
.drips i::after{content:"";position:absolute;bottom:-3px;left:-1px;width:7px;height:7px;border-radius:50%;background:#e0314b}
@keyframes drip{0%{height:0;opacity:1}55%{height:46px}85%{height:60px;opacity:1}100%{height:60px;opacity:0}}
.note{animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eye{animation:pulse 2.4s ease-in-out infinite,sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg) scale(1.08)}}
#lock{background:radial-gradient(900px 500px at 50% 30%,#2a0a12 0%,#040203 72%)}

@keyframes burst{from{transform:scale(.2);opacity:1}to{transform:scale(2.4);opacity:0}}
#lock.out{animation:zoomout .8s ease-in forwards}

body.viewing #ghost{display:none}
</style>

<script>
(function(){
  var cv=document.getElementById("ghost");
  try{
    if(!window.THREE)throw 0;
    var T=THREE, r=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
    r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    var sc=new T.Scene(), cam=new T.PerspectiveCamera(35,1,.1,50);
    cam.position.set(0,.3,7);
    sc.add(new T.AmbientLight(0x2a1520,.8));
    var rim=new T.DirectionalLight(0x6a5cff,.9);rim.position.set(-3,2,-2);sc.add(rim);
    var key=new T.DirectionalLight(0xff5060,.35);key.position.set(2,1,4);sc.add(key);
    var eyeLight=new T.PointLight(0xff1f3a,1.6,5);eyeLight.position.set(0,1.55,1.2);sc.add(eyeLight);

    var g=new T.Group();sc.add(g);
    var dark=new T.MeshStandardMaterial({color:0x0b0608,roughness:.95,metalness:0});

    var cg=new T.ConeGeometry(1.05,2.8,40,14,true);
    var cloak=new T.Mesh(cg,new T.MeshStandardMaterial({color:0x0b0608,roughness:.95,side:T.DoubleSide}));
    cloak.position.y=.1;g.add(cloak);
    var pos=cg.attributes.position, base=[], ang=[];
    for(var i=0;i<pos.count;i++){var x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);base.push([x,y,z]);ang.push(Math.atan2(z,x))}

    var head=new T.Group();head.position.y=1.55;g.add(head);
    var hood=new T.Mesh(new T.SphereGeometry(.52,28,20),dark);hood.scale.set(1,1.1,1);head.add(hood);
    var voidM=new T.Mesh(new T.SphereGeometry(.4,24,16),new T.MeshBasicMaterial({color:0x000000}));
    voidM.position.set(0,0,.2);voidM.scale.set(.85,.95,.8);head.add(voidM);
    var eyeMat=new T.MeshBasicMaterial({color:0xff2a45});
    var eL=new T.Mesh(new T.SphereGeometry(.065,12,10),eyeMat),eR=eL.clone();
    eL.position.set(-.17,.04,.53);eR.position.set(.17,.04,.53);head.add(eL);head.add(eR);

    var staff=new T.Mesh(new T.CylinderGeometry(.035,.035,3.6,8),new T.MeshStandardMaterial({color:0x1a1114,roughness:.8}));
    staff.position.set(1.2,-.1,.3);g.add(staff);
    var blade=new T.Mesh(new T.TorusGeometry(.5,.035,8,28,Math.PI*1.1),new T.MeshStandardMaterial({color:0x9aa0b8,metalness:.8,roughness:.3,emissive:0x1a1030}));
    blade.position.set(.95,1.7,.3);blade.rotation.z=-.3;g.add(blade);

    function size(){var w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
    size();window.addEventListener("resize",size);

    var px=0,py=0;
    function aim(x,y){px=(x/innerWidth)*2-1;py=(y/innerHeight)*2-1}
    window.addEventListener("pointermove",function(e){aim(e.clientX,e.clientY)});
    window.addEventListener("touchmove",function(e){var t=e.touches[0];if(t)aim(t.clientX,t.clientY)},{passive:true});

    var clock=new T.Clock(),still=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
    function tick(){if(document.body.classList.contains("viewing")){requestAnimationFrame(tick);return}
      var t=still?0:clock.getElapsedTime();
      g.position.y=-.35+Math.sin(t*1.3)*.12;
      g.rotation.y+=((px*.6)-g.rotation.y)*.06;
      head.rotation.y+=((px*.5)-head.rotation.y)*.08;
      head.rotation.x+=((py*.25)-head.rotation.x)*.08;
      for(var i=0;i<pos.count;i++){
        var b=base[i],f=(1.4-b[1])/2.8;if(f<0)f=0;
        var d=1+Math.sin(t*1.7+ang[i]*3+b[1]*2)*.07*f;
        pos.setXYZ(i,b[0]*d,b[1],b[2]*d);
      }
      pos.needsUpdate=true;
      var blink=(Math.sin(t*.9)>.985)?.1:1;
      eL.scale.y=eR.scale.y=blink;
      var fl=.75+Math.sin(t*9)*.15+Math.sin(t*23)*.1;
      eyeLight.intensity=1.6*fl;
      blade.rotation.z=-.3+Math.sin(t*1.3)*.04;
      r.render(sc,cam);
      requestAnimationFrame(tick);
    }
    tick();
  }catch(e){cv.style.display="none"}
})();
</script>
<script>
(function(){
  var V={"s":"","i":"","c":"","n":600000}; /* yahan encrypted private file ka data aata hai */
  var PUB="7a40c1287b7e898a41607034c3f263412a1f6f46ce5df1aea18368ed240935d3";
  var SUBJ=[["maths","📐","Maths"],["physics","⚛️","Physics"],["chemistry","🧪","Chemistry"],["hindi","📖","Hindi"],["english","🔤","English"],["cs","💻","CS"]];
  var NOTES={maths:[],physics:[],chemistry:[],hindi:[],english:[],cs:[]}; /* {t:"naam", pages:[base64 jpg...], pdf:"base64"} */
  function $(i){return document.getElementById(i)}
  function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
  async function sha(t){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
  async function decrypt(pw){
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(V.s),iterations:V.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(V.i)},key,u8(V.c));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  var role="",pdfBytes=null,busy=false,dls=null,cur="";

  function show(name){
    ["hub","subj","viewer"].forEach(function(n){$(n).hidden=(n!==name)});
    document.body.classList.toggle("viewing",name==="viewer");
    window.scrollTo(0,0);
  }

  function openViewer(title,pages,pdf){
    $("vtitle").textContent="🔒 "+title;
    var box=$("pages");box.innerHTML="";
    pages.forEach(function(p,i){var im=document.createElement("img");im.className="pg";im.alt="Page "+(i+1);im.src="data:image/jpeg;base64,"+p;box.appendChild(im)});
    pdfBytes=pdf?u8(pdf):null;
    $("dl").hidden=!(dls&&pdfBytes);
    $("dmsg").textContent="";
    show("viewer");
  }

  function openSubject(k,e,n){
    cur=k;$("stitle").textContent=e+" "+n;
    var list=$("list");list.innerHTML="";
    var arr=NOTES[k]||[];
    $("cnt").textContent=arr.length+" notes";
    if(!arr.length){var d=document.createElement("div");d.className="empty";d.textContent="Is subject ke notes jaldi aayenge…";list.appendChild(d)}
    arr.forEach(function(nt){
      var row=document.createElement("div");row.className="note";
      var w=document.createElement("div");w.className="nm";
      var a=document.createElement("a");a.href="#";a.textContent=nt.t;
      a.onclick=function(ev){ev.preventDefault();openViewer(nt.t,nt.pages||[],nt.pdf||null)};
      w.appendChild(a);row.appendChild(w);list.appendChild(row);
    });
    show("subj");
  }

  function buildHub(){
    var g=$("grid");g.innerHTML="";
    SUBJ.forEach(function(s){
      var b=document.createElement("button");b.type="button";b.className="tile";
      var i=document.createElement("b");i.textContent=s[1];
      var t=document.createElement("span");t.textContent=s[2];
      b.appendChild(i);b.appendChild(t);
      b.onclick=function(){openSubject(s[0],s[1],s[2])};
      g.appendChild(b);
    });
  }

  function relock(){
    role="";pdfBytes=null;$("pages").innerHTML="";
    $("app").hidden=true;
    document.body.classList.remove("viewing");
    var l=$("lock");l.className="";l.hidden=false;
    $("lbox").className="box";$("lmsg").textContent="";$("pw").value="";
    window.scrollTo(0,0);
  }

  async function unlockAnim(){
    $("lbox").classList.add("open");
    $("lock").classList.add("burst");
    await wait(900);
    $("lock").classList.add("out");
    await wait(800);
    $("lock").hidden=true;
  }

  async function go(){
    if(busy)return;
    var pw=$("pw").value;if(!pw)return;
    busy=true;$("open").disabled=true;$("lmsg").textContent="Taala khul raha hai…";
    var priv=null,ok=false;
    try{
      if((await sha(pw))===PUB){ok=true;role="pub"}
      else{priv=await decrypt(pw);ok=true;role="priv"}
    }catch(e){ok=false}
    if(!ok){
      $("lmsg").textContent="Galat raaz. Dobara koshish karo.";
      var b=$("lbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$("pw").value="";
      busy=false;$("open").disabled=false;return;
    }
    $("pw").value="";
    $("app").hidden=false;
    if(role==="pub"){buildHub();show("hub")}
    else{openViewer(priv.name,priv.pages,priv.pdf)}
    await unlockAnim();
    busy=false;$("open").disabled=false;
  }

  $("open").onclick=go;
  $("pw").onkeydown=function(e){if(e.key==="Enter")go()};
  $("relock1").onclick=relock;
  $("back1").onclick=function(){show("hub")};
  $("back2").onclick=function(){if(role==="priv")relock();else show("subj")};
  $("dl").onclick=async function(){
    if(!dls||!pdfBytes)return;
    try{await dls.save({filename:"notes.pdf",data:pdfBytes})}catch(e){$("dmsg").textContent="Download nahi hua."}
  };
  (async function(){try{if(window.claude&&claude.use)dls=await claude.use("downloads")}catch(e){}})();
})();
</script>
<script>
(function(){
  var d=document.getElementById("drips");
  if(d)for(var i=0;i<9;i++){var e=document.createElement("i");e.style.left=(6+i*11+Math.random()*5)+"%";e.style.animationDelay=(Math.random()*6).toFixed(1)+"s";e.style.animationDuration=(5+Math.random()*4).toFixed(1)+"s";d.appendChild(e)}
  function mv(x,y){document.body.style.setProperty("--mx",x+"px");document.body.style.setProperty("--my",y+"px")}
  window.addEventListener("pointermove",function(e){mv(e.clientX,e.clientY)});
  window.addEventListener("touchmove",function(e){var t=e.touches[0];if(t)mv(t.clientX,t.clientY)},{passive:true});
  document.getElementById("bulb").onclick=function(){document.body.classList.toggle("lit")};
})();
</script>
